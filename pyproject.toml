[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-day-trader-skill"
version = "0.1.0"
description = "Read-only Indian-market trading research with FYERS data"
requires-python = ">=3.10"
dependencies = [
  "fyers-apiv3",
  "mcp[cli]>=1.0.0",
  "keyring>=25.0.0",
]

[project.scripts]
india-trader = "india_trader.cli:main"

[tool.setuptools.packages.find]
include = ["india_trader*"]
